# 度量目录接口：分类 → 度量项 → 度量子项
# 路径：#{class}-{item}-{sub}  例：#F1-E1-eta_ov
schema: metrics.catalog/v1
title: 下一代调试调优度量体系
levels:
  - id: class
    name: 度量分类
  - id: item
    name: 度量项
  - id: sub
    name: 度量子项

classes:
  - id: F1
    name: 互联带宽
    axis: 卡间 / 核间 / 引擎间交换是否墙
    items:
      - id: E1
        name: 通算 overlap 线性可叠加度
        dim: E
        W_item: 1.00
        subs:
          - {id: eta_ov, name: overlap 场景占比, symbol: η_ov}
          - {id: eta_lin, name: 叠加效率, symbol: η_lin}
          - {id: L_blk, name: 手工同步阻塞代码行, symbol: L_blk}
      - id: A3
        name: 同步暴露
        dim: A
        W_item: 0.10
        subs:
          - {id: n_intra, name: 核内同步调用数, symbol: n_intra}
          - {id: n_inter, name: 核间同步调用数, symbol: n_inter}
          - {id: eta_xcore, name: 自动核间同步覆盖率, symbol: η_xcore}
      - id: A9
        name: 同步流水复杂度
        dim: A
        W_item: 0.04
        expanded: true
        subs:
          - {id: n_pipe, name: 流水级数, symbol: n_pipe}
          - {id: n_ord, name: 序域个数, symbol: n_ord}
      - id: A13
        name: 自动同步消除率
        dim: A
        W_item: 0.05
        expanded: true
        subs:
          - {id: eta_sync, name: 自动同步消除率, symbol: η_sync}
      - id: A11
        name: ID 残留对消
        dim: A
        W_item: 0.02
        expanded: true
        subs:
          - {id: L_cancel, name: ID 对消代码行, symbol: L_cancel}
          - {id: n_resid, name: 对消后残留次数, symbol: n_resid}
      - id: C3
        name: 故障隔离与恢复
        dim: C
        redline: true
        W_item: 0.13
        subs:
          - {id: g_rst, name: 最小复位范围, symbol: g_rst}
          - {id: eta_rst, name: 局部复位成功率, symbol: η_rst}
          - {id: MTTR, name: 平均恢复时间, symbol: MTTR}

  - id: F2
    name: 数据精度
    axis: dtype / 量化 / 转换 / 舍入
    items:
      - id: B3
        name: 数值/类型支持度
        dim: B
        redline: true
        W_item: 0.07
        subs:
          - {id: h_bar, name: 类型转换平均跳数, symbol: h̄}
          - {id: eta_type, name: 类型完备度, symbol: η_type}
      - id: B6
        name: 随路搬运
        dim: B
        W_item: 0.13
        expanded: true
        subs:
          - {id: n_fix, name: 随路互斥拆分步数, symbol: n_fix}
          - {id: n_fmt, name: 格式转换调用数, symbol: n_fmt}
      - id: A15
        name: 自动格式转换覆盖率
        dim: A
        W_item: 0.02
        expanded: true
        subs:
          - {id: eta_fmt, name: 自动格式转换覆盖率, symbol: η_fmt}
      - id: C2
        name: 确定性与重放
        dim: C
        redline: true
        W_item: 0.20
        subs:
          - {id: eta_det, name: 同输入结果一致率, symbol: η_det}
          - {id: eta_rep, name: 执行顺序可重放率, symbol: η_rep}
      - id: C4
        name: 错误遥测
        dim: C
        redline: true
        W_item: 0.27
        subs:
          - {id: eta_ex, name: 异常类型覆盖率, symbol: η_ex}
          - {id: eta_hit_fault, name: 异常检出率, symbol: η_det}
          - {id: rho_sdc, name: 静默数据错误率, symbol: ρ_sdc}
          - {id: eta_root, name: 首因识别率, symbol: η_root}
          - {id: eta_snap, name: 现场保存成功率, symbol: η_snap}
      - id: A8
        name: 多版本一致性
        dim: A
        W_item: 0.04
        expanded: true
        subs:
          - {id: eta_ver, name: 跨版本行为一致率, symbol: η_ver}
          - {id: n_drift, name: 跨版本语义漂移数, symbol: n_drift}
      - id: D2
        name: API 破坏性变更
        dim: D
        weak: true
        W_item: 0.25
        subs:
          - {id: n_brk, name: 每代 API 破坏性变更数, symbol: n_brk}
          - {id: eta_brk, name: 破坏性变更可检测率, symbol: η_det}

  - id: F3
    name: Batch 利用率
    axis: 小 batch / 短序列时阵列与核是否吃不满
    items:
      - id: B1
        name: 搬运复杂度（tiling）
        dim: B
        W_item: 0.33
        subs:
          - {id: n_til, name: Tiling 参数个数, symbol: n_til}
      - id: A14
        name: 自动 tiling 命中率
        dim: A
        W_item: 0.04
        expanded: true
        subs:
          - {id: eta_til, name: 自动 tiling 命中率, symbol: η_til}
      - id: A7
        name: 编译友好屏蔽率
        dim: A
        W_item: 0.10
        subs:
          - {id: eta_sh, name: 编译友好屏蔽率, symbol: η_sh}
      - id: D4
        name: 形态配比保持度
        dim: D
        W_item: 0.09
        subs:
          - {id: delta_ratio, name: 形态比变更幅度, symbol: Δ_ratio}
          - {id: rho_rw, name: 算子重编写比例, symbol: ρ_rw}
      - id: D6
        name: 配比变化重写量
        dim: D
        W_item: 0.04
        subs:
          - {id: L_rw, name: 配比变化重写代码行, symbol: L_rw}
      - id: D7
        name: 核映射自适应度
        dim: D
        W_item: 0.03
        subs:
          - {id: eta_nmap, name: 自动核映射命中率, symbol: η_map}
      - id: A12
        name: 高层 API 替代覆盖率
        dim: A
        weak: true
        W_item: 0.05
        expanded: true
        subs:
          - {id: eta_hl, name: 高层 API 覆盖率, symbol: η_hl}

  - id: F4
    name: 每 token FLOPs
    axis: 算术强度 / 每 token 运算量
    items:
      - id: B2
        name: 计算复杂度
        dim: B
        W_item: 0.13
        subs:
          - {id: rho_ins, name: 指令粒度比, symbol: ρ_ins}
      - id: B7
        name: 计算行为表达
        dim: B
        W_item: 0.04
        expanded: true
        subs:
          - {id: n_beh, name: 显式饱和/舍入/特殊函数调用数, symbol: n_beh}
      - id: A2
        name: 多流水暴露
        dim: A
        W_item: 0.08
        subs:
          - {id: r_sw, name: Pipeline 切换手动同步代码占比, symbol: r_sw}
          - {id: eta_auto, name: 自动同步覆盖率, symbol: η_auto}
          - {id: n_VF, name: VF 表达数, symbol: n_VF}
      - id: A4
        name: API-指令耦合
        dim: A
        W_item: 0.08
        subs:
          - {id: p_bar, name: 入参平均数, symbol: p̄}
          - {id: n_reg, name: 寄存器配置数, symbol: n_reg}
          - {id: delta_sig, name: 跨版本签名差异数, symbol: Δ_sig}
      - id: D5
        name: 算力配比冲击度
        dim: D
        W_item: 0.09
        subs:
          - {id: delta_pow, name: 配比变化幅度, symbol: Δ_pow}
          - {id: rho_retune, name: tiling/流水重调比例, symbol: ρ_retune}
      - id: D1
        name: 源码跨代可移植性
        dim: D
        W_item: 0.34
        subs:
          - {id: eta_port, name: 跨代零改动编译通过率, symbol: η_port}
          - {id: eta_perf, name: 跨代性能达成率, symbol: η_perf}
      - id: C1
        name: 性能度量覆盖
        dim: C
        W_item: 0.33
        subs:
          - {id: eta_evt, name: 关键性能事件覆盖率, symbol: η_evt}
          - {id: eps_met, name: 指标相对误差, symbol: ε_met}
          - {id: rho_loss, name: 数据丢失率, symbol: ρ_loss}
          - {id: eta_stall, name: Stall 原因解释覆盖率, symbol: η_stall}
      - id: C5
        name: 源码关联深度
        dim: C
        W_item: 0.07
        subs:
          - {id: eta_map, name: 模型→算子→kernel→指令映射完备度, symbol: η_map}
          - {id: eta_hit, name: 硬件事件→可修改代码命中率, symbol: η_hit}
      - id: A16
        name: 用户实际感知暴露度
        dim: A
        weak: true
        W_item: 0.02
        expanded: true
        subs:
          - {id: n_perc, name: 用户须感知暴露项数, symbol: n_perc}

  - id: F5
    name: 显存容量
    axis: 工作集 / workspace / 片上缓冲能否放下
    items:
      - id: A5
        name: 资源/约束暴露
        dim: A
        W_item: 0.04
        subs:
          - {id: L_mm, name: 内存管理代码行, symbol: L_mm}
          - {id: L_id, name: ID 管理代码行, symbol: L_id}
      - id: A10
        name: 设备初始化
        dim: A
        W_item: 0.02
        expanded: true
        subs:
          - {id: L_init, name: 设备初始化代码行, symbol: L_init}
      - id: D3
        name: 二进制兼容性
        dim: D
        weak: true
        W_item: 0.16
        subs:
          - {id: eta_load, name: 跨代可加载率, symbol: η_load}

  - id: F6
    name: 显存敏感
    axis: 对带宽、层级、对齐、一致性敏感
    items:
      - id: A1
        name: 内存层级暴露
        dim: A
        W_item: 0.12
        subs:
          - {id: deltaK, name: Tiling Key 增长量, symbol: ΔK}
          - {id: r_mv, name: 搬运代码行占比, symbol: r_mv}
      - id: A6
        name: 硬件约束暴露
        dim: A
        W_item: 0.04
        subs:
          - {id: L_dcci, name: DCCI 代码行, symbol: L_dcci}
      - id: B4
        name: 地址计算
        dim: B
        W_item: 0.17
        expanded: true
        subs:
          - {id: L_addr, name: 地址计算代码行, symbol: L_addr}
      - id: B5
        name: 地址对齐
        dim: B
        W_item: 0.13
        expanded: true
        subs:
          - {id: n_pad, name: 对齐边界分支数, symbol: n_pad}
